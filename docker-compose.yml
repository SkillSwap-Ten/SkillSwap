# docker-compose.yml — SkillSwap v2 local development
# All sensitive values come from .env (gitignored). See .env.example for placeholders.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillswap-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-SkillSwap}
      Jwt__Audience: ${JWT_AUDIENCE:-SkillSwap}
      Serilog__WriteTo__1__Args__serverUrl: ${SEQ_URL:-http://seq}
    depends_on:
      mysql:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - skillswap-net

  mysql:
    image: mysql:8.0
    container_name: skillswap-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - skillswap-net

  seq:
    image: datalust/seq:latest
    container_name: skillswap-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${SEQ_UI_PORT:-5341}:80"
    volumes:
      - seq-data:/data
    networks:
      - skillswap-net

volumes:
  mysql-data:
    name: skillswap-mysql-data
  seq-data:
    name: skillswap-seq-data

networks:
  skillswap-net:
    driver: bridge
    name: skillswap-net
